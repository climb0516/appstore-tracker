<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="no-referrer">
  <title>AppWatch · 券商 App 竞品追踪</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔭</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060a0a;
      --panel: rgba(18,26,26,0.72);
      --panel-solid: #111918;
      --hover: rgba(255,255,255,0.04);
      --line: rgba(255,255,255,0.07);
      --line-2: rgba(255,255,255,0.13);
      --text-1: #eaf1f0;
      --text-2: #9fb0ad;
      --text-3: #65746f;
      --accent: #2dd4bf;
      --grad: linear-gradient(120deg, #10b981 0%, #2dd4bf 50%, #38bdf8 100%);
      --grid-dot: rgba(255,255,255,0.045);
      --glow-1: rgba(16,185,129,0.15);
      --glow-2: rgba(56,189,248,0.09);
      --new: #ff3b4e;
      --up: #22c55e;
      --down: #ef4444;
      --star: #fbbf24;
      --kbd-bg: rgba(255,255,255,0.06);
    }
    :root[data-theme="light"] {
      --bg: #f6f9f8;
      --panel: rgba(255,255,255,0.88);
      --panel-solid: #ffffff;
      --hover: rgba(10,40,35,0.035);
      --line: rgba(10,40,35,0.08);
      --line-2: rgba(10,40,35,0.15);
      --text-1: #11201d;
      --text-2: #4c5f5b;
      --text-3: #879692;
      --accent: #0d9488;
      --grid-dot: rgba(10,40,35,0.06);
      --glow-1: rgba(16,185,129,0.09);
      --glow-2: rgba(56,189,248,0.06);
      --new: #e11d48;
      --up: #16a34a;
      --down: #dc2626;
      --star: #d97706;
      --kbd-bg: rgba(10,40,35,0.05);
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--text-1);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; min-height: 100vh;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(600px 400px at 15% -5%, var(--glow-1), transparent 70%),
        radial-gradient(700px 500px at 95% 0%, var(--glow-2), transparent 70%),
        radial-gradient(circle, var(--grid-dot) 1px, transparent 1px) 0 0 / 22px 22px;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; }

    /* ── Top bar ── */
    .topbar {
      position: sticky; top: 0; z-index: 30;
      background: color-mix(in srgb, var(--bg) 72%, transparent);
      backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px);
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner { max-width: 1400px; margin: 0 auto; padding: 0 24px; height: 60px; display: flex; align-items: center; gap: 20px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -0.02em; white-space: nowrap; }
    .logo-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--grad); display: grid; place-items: center; font-size: 15px; box-shadow: 0 0 20px var(--glow-1); }
    .logo small { font-weight: 500; font-size: 12px; color: var(--text-3); letter-spacing: 0; }
    .search {
      flex: 1; max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 8px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; height: 36px;
      transition: border-color .15s, box-shadow .15s;
    }
    .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow-1); }
    .search svg { color: var(--text-3); flex: none; }
    .search input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: var(--text-1); font: inherit; font-size: 13.5px; }
    .search input::placeholder { color: var(--text-3); }
    kbd { font-family: inherit; font-size: 11px; color: var(--text-3); background: var(--kbd-bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
    .top-right { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
    .updated { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,0.2); animation: pulse 2s infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(34,197,94,0); } }
    .icon-btn { width: 34px; height: 34px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; display: grid; place-items: center; color: var(--text-2); flex: none; }
    .icon-btn:hover { color: var(--text-1); border-color: var(--line-2); }
    .icon-btn:disabled { cursor: default; opacity: .6; }
    .icon-btn.spin svg { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Layout ── */
    .layout { max-width: 1400px; margin: 0 auto; padding: 24px 24px 64px; display: grid; grid-template-columns: 200px minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
    .side { position: sticky; top: 84px; max-height: calc(100vh - 100px); overflow-y: auto; scrollbar-width: none; }
    .side::-webkit-scrollbar { display: none; }
    .side-title { font-size: 11.5px; color: var(--text-3); padding: 0 10px; margin: 4px 0 8px; letter-spacing: .04em; }
    .side-group + .side-group { margin-top: 22px; }
    .nav-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; border: none; background: none; cursor: pointer; text-align: left; color: var(--text-2); font-size: 13.5px; position: relative; }
    .nav-item:hover { background: var(--hover); color: var(--text-1); }
    .nav-item.active { background: var(--panel); color: var(--text-1); box-shadow: inset 0 0 0 1px var(--line); }
    .nav-item.active::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--grad); }
    .nav-item .count { margin-left: auto; font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
    .app-icon { width: 20px; height: 20px; border-radius: 5px; flex: none; object-fit: cover; background: var(--hover); }
    .app-icon.md { width: 34px; height: 34px; border-radius: 8px; }
    .app-icon.lg { width: 48px; height: 48px; border-radius: 11px; box-shadow: 0 0 0 1px var(--line); }
    .flag { width: 20px; height: 20px; border-radius: 6px; flex: none; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; background: var(--grad); }

    /* ── Main header ── */
    .main-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
    .main-head h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
    .main-head h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .main-head p { font-size: 12.5px; color: var(--text-3); margin-top: 4px; }
    .tabs { display: flex; gap: 2px; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
    .tab { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 7px; border: none; background: none; cursor: pointer; font-size: 13px; color: var(--text-3); white-space: nowrap; }
    .tab:hover { color: var(--text-1); }
    .tab.active { background: var(--hover); color: var(--text-1); box-shadow: inset 0 0 0 1px var(--line-2); }

    /* 卡片不用 backdrop-filter：画像页卡片很多时 Chrome 合成层会丢，部分卡片整块渲染成空白 */
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
    .new { font-size: 10.5px; line-height: 16px; padding: 0 5px; border-radius: 4px; color: #fff; background: var(--new); font-weight: 700; vertical-align: 1px; white-space: nowrap; }
    .muted { color: var(--text-3); }
    .warn { color: #f59e0b; }
    .star { color: var(--star); }
    .up { color: var(--up); } .down { color: var(--down); }
    .empty { text-align: center; padding: 60px 0; color: var(--text-3); }
    .loading { padding: 80px 0; text-align: center; color: var(--text-3); }
    .note { font-size: 12px; color: var(--text-3); margin-top: 12px; }

    /* ── Overview ── */
    .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    .app { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
    .app.fresh { border-color: color-mix(in srgb, var(--new) 55%, transparent); }
    .app-head { display: flex; gap: 12px; align-items: center; min-width: 0; }
    .app-head > div { min-width: 0; }
    .app-head b { font-size: 15.5px; display: block; }
    .app-head b a:hover { color: var(--accent); }
    .app-head small { font-size: 11.5px; color: var(--text-3); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .stat { background: var(--hover); border-radius: 9px; padding: 8px 10px; min-width: 0; }
    .stat > span { font-size: 11px; color: var(--text-3); display: block; }
    .stat b { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .stat small { font-size: 11px; color: var(--text-3); }
    .app .notes { font-size: 12.5px; color: var(--text-2); white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .sparks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .spark { font-size: 11px; color: var(--text-3); }
    .spark svg { display: block; width: 100%; height: 30px; margin-top: 2px; }
    .spark .pending { height: 30px; display: grid; place-items: center; border: 1px dashed var(--line-2); border-radius: 6px; margin-top: 2px; }

    /* ── Timeline ── */
    .tl { display: flex; flex-direction: column; gap: 12px; }
    .rel { padding: 16px 18px; display: flex; gap: 14px; }
    .rel-body { flex: 1; min-width: 0; }
    .rel-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--text-3); margin-bottom: 4px; }
    .rel-meta b { color: var(--text-1); font-size: 14.5px; }
    .rel-meta .ver { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
    .rel details { margin-top: 4px; }
    .rel summary { list-style: none; cursor: pointer; }
    .rel summary::-webkit-details-marker { display: none; }
    .rel .notes { font-size: 13px; color: var(--text-2); white-space: pre-line; overflow-wrap: anywhere; }
    .rel details:not([open]) .notes { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .rel .more { font-size: 12px; color: var(--accent); margin-top: 4px; }
    .rel details[open] .more { display: none; }

    /* ── Compare table ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
    th { text-align: left; font-weight: 600; font-size: 12px; color: var(--text-3); padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; }
    th:hover { color: var(--text-1); }
    th.sorted { color: var(--accent); }
    td { padding: 10px 12px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--hover); }
    td.app-cell { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    td.app-cell a:hover { color: var(--accent); }
    .num { text-align: right; }

    /* ── Chart ── */
    .rank-list { padding: 6px; }
    .rank-row { display: flex; align-items: center; gap: 12px; padding: 7px 10px; border-radius: 8px; }
    .rank-row:hover { background: var(--hover); }
    .rank-row.tracked { background: color-mix(in srgb, var(--accent) 12%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); }
    .rank-row .rk { width: 26px; flex: none; text-align: right; font-weight: 700; color: var(--text-3); font-variant-numeric: tabular-nums; }
    .rank-row .rk.top { color: var(--accent); }
    .rank-row .nm { flex: 1; min-width: 0; }
    .rank-row .nm a { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-row .nm a:hover { color: var(--accent); }
    .rank-row .nm small { display: block; font-size: 11.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-row .dl { width: 52px; flex: none; text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }

    /* ── Profile ── */
    .pf-head { padding: 18px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .pf-head .app-icon { width: 64px; height: 64px; border-radius: 14px; box-shadow: 0 0 0 1px var(--line); }
    .pf-head h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
    .pf-head h2 a:hover { color: var(--accent); }
    .pf-head p { font-size: 12.5px; color: var(--text-3); }
    .pf-kpis { margin-left: auto; display: flex; gap: 18px; flex-wrap: wrap; }
    .pf-kpis div { text-align: right; }
    .pf-kpis b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
    .pf-kpis span { font-size: 11px; color: var(--text-3); }
    .pf-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
    .pf-sec { padding: 16px 18px; min-width: 0; }
    .pf-sec.wide { grid-column: 1 / -1; }
    .pf-sec h3 { font-size: 14px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .pf-sec h3 small { font-weight: 500; font-size: 11.5px; color: var(--text-3); margin-left: auto; }
    .pf-intro { font-size: 13.5px; color: var(--text-2); line-height: 1.7; overflow-wrap: anywhere; }
    .meta-row { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text-3); margin-top: 10px; }
    .meta-row b { color: var(--text-2); font-weight: 600; }
    .ftags { display: flex; flex-direction: column; gap: 8px; }
    .ftags .grp { display: flex; gap: 8px; align-items: baseline; }
    .ftags .grp > span { width: 32px; flex: none; font-size: 11.5px; color: var(--text-3); }
    .ftags .grp div { display: flex; flex-wrap: wrap; gap: 5px; }
    .ftag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--hover); border: 1px solid var(--line); white-space: nowrap; }
    .ftag.notes { border-color: color-mix(in srgb, var(--accent) 55%, transparent); color: var(--accent); }
    .hl-list { list-style: none; display: flex; flex-direction: column; gap: 7px; counter-reset: hl; }
    .hl-list li { font-size: 13px; color: var(--text-2); padding-left: 26px; position: relative; overflow-wrap: anywhere; line-height: 1.6; }
    .hl-list li::before { counter-increment: hl; content: counter(hl); position: absolute; left: 0; top: 1px; width: 18px; height: 18px; border-radius: 6px; background: var(--grad); color: #04201a; font-size: 11px; font-weight: 800; display: grid; place-items: center; }
    .shots { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
    .shots img { height: 300px; border-radius: 12px; flex: none; border: 1px solid var(--line); background: var(--hover); }
    .bars { display: flex; flex-direction: column; gap: 5px; }
    .bar-row { display: grid; grid-template-columns: 64px 1fr 44px; gap: 10px; align-items: center; font-size: 12px; color: var(--text-2); }
    .bar { height: 7px; background: var(--hover); border-radius: 4px; overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
    .bar.star i { background: var(--star); }
    .bar.neg i { background: var(--down); }
    .bar-row span:last-child { text-align: right; color: var(--text-3); font-variant-numeric: tabular-nums; }
    .rv { padding: 10px 0; border-top: 1px solid var(--line); }
    .rv:first-child { border-top: none; padding-top: 0; }
    .rv-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 11.5px; color: var(--text-3); }
    .rv-meta .stars { color: var(--star); letter-spacing: 1px; font-size: 12px; }
    .rv-meta .stars.low { color: var(--down); }
    .rv b { display: block; font-size: 13.5px; margin: 2px 0; overflow-wrap: anywhere; }
    .rv p { font-size: 12.5px; color: var(--text-2); overflow-wrap: anywhere; }
    .nw { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
    .nw:first-child { border-top: none; padding-top: 0; }
    .nw a { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .nw a:hover { color: var(--accent); }
    .nw small { font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
    .rev-tag { font-size: 10.5px; font-weight: 700; padding: 0 5px; line-height: 16px; border-radius: 4px; color: #fff; background: #8b5cf6; white-space: nowrap; }
    .pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
    .pick button { display: flex; gap: 10px; align-items: center; padding: 12px; text-align: left; cursor: pointer; }
    .pick button:hover { border-color: var(--accent); }
    .chip-btn { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; color: var(--text-2); }
    .chip-btn.on { border-color: var(--accent); color: var(--text-1); background: color-mix(in srgb, var(--accent) 14%, transparent); }
    .toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
    .toolbar .muted { font-size: 12px; margin-left: auto; }

    /* ── Matrix / heat tables ── */
    .matrix th { cursor: default; text-align: center; vertical-align: bottom; }
    .matrix th:first-child, .matrix td:first-child { text-align: left; position: sticky; left: 0; background: var(--panel-solid, var(--bg)); z-index: 1; }
    .matrix th .app-icon { display: block; margin: 0 auto 4px; }
    .matrix td { text-align: center; }
    .matrix tr.grp td { font-size: 11.5px; color: var(--text-3); font-weight: 600; background: var(--hover); text-align: left; }
    .yes { color: var(--accent); font-weight: 800; }
    .yes.notes { color: var(--up); }
    .no { color: var(--text-3); opacity: .5; }
    .heat { border-radius: 6px; padding: 3px 8px; display: inline-block; min-width: 44px; font-variant-numeric: tabular-nums; }
    .rk-cell { font-weight: 700; font-variant-numeric: tabular-nums; }
    .rk-cell.g1 { color: var(--up); } .rk-cell.g2 { color: var(--accent); } .rk-cell.g3 { color: var(--text-2); font-weight: 500; }
    .mini-stack { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--hover); margin: 8px 0 6px; }
    .mini-stack i { display: block; height: 100%; }
    .rv-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .rv-card { padding: 14px 16px; }
    .rv-card .top { display: flex; gap: 10px; align-items: center; }
    .rv-card .top b { font-size: 14px; }
    .rv-card .big { margin-left: auto; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .rv-card small { font-size: 11.5px; color: var(--text-3); display: block; }
    .rv-card .chips2 { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .rv-card .chips2 span { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--down) 14%, transparent); color: var(--down); }
    .section-title { font-size: 13px; color: var(--text-3); margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }
    .section-title:first-child { margin-top: 0; }
    .section-title b { color: var(--text-1); font-size: 14.5px; }

    /* ── Right widgets ── */
    .widget { padding: 14px 16px 12px; }
    .widget + .widget { margin-top: 16px; }
    .widget-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .widget-head b { font-size: 14px; }
    .widget-head small { font-size: 11.5px; color: var(--text-3); }
    .w-row { display: flex; gap: 10px; padding: 5px 0; font-size: 13px; align-items: center; }
    .w-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .w-row small { color: var(--text-3); font-size: 11px; white-space: nowrap; }
    .status-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 4px 0; color: var(--text-2); }
    .status-row .t { margin-left: auto; color: var(--text-3); font-size: 11.5px; white-space: nowrap; }
    .ok { color: #22c55e; } .bad { color: #ef4444; }

    /* ── Responsive ── */
    @media (max-width: 1180px) {
      .layout { grid-template-columns: 180px minmax(0, 1fr); }
      .right { display: none; }
    }
    @media (max-width: 760px) {
      .topbar-inner { padding: 0 14px; gap: 10px; }
      .logo small, .updated span, kbd { display: none; }
      .search { min-width: 0; }
      .layout { grid-template-columns: minmax(0, 1fr); padding: 14px 14px 48px; gap: 14px; }
      .side { position: static; max-height: none; overflow: visible; min-width: 0; }
      .side-group + .side-group { margin-top: 10px; }
      .side-title { display: none; }
      .nav-list { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
      .nav-list::-webkit-scrollbar { display: none; }
      .nav-item { width: auto; flex: none; white-space: nowrap; border: 1px solid var(--line); padding: 5px 10px; }
      .nav-item.active::before { display: none; }
      .nav-item .count { display: none; }
      .tabs { width: 100%; overflow-x: auto; scrollbar-width: none; }
      .tabs::-webkit-scrollbar { display: none; }
      .tab { padding: 6px 10px; }
      .app-grid { grid-template-columns: minmax(0, 1fr); }
      .pf-grid { grid-template-columns: minmax(0, 1fr); }
      .pf-kpis { margin-left: 0; width: 100%; justify-content: space-between; }
      .pf-kpis div { text-align: left; }
      .shots img { height: 240px; }
      .rv-cards { grid-template-columns: minmax(0, 1fr); }
      .rel { padding: 14px; gap: 12px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="#"><span class="logo-mark">🔭</span>AppWatch <small>券商 App 竞品追踪</small></a>
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" placeholder="搜索 App、版本、更新内容…" autocomplete="off">
        <kbd id="kbd">⌘K</kbd>
      </label>
      <div class="top-right">
        <div class="updated"><i class="live-dot"></i><span id="updated">加载中…</span></div>
        <button class="icon-btn" id="reload" title="重新加载数据" aria-label="重新加载数据">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <a class="icon-btn" href="https://github.com/climb0516/appstore-tracker/actions/workflows/scrape.yml" target="_blank" rel="noopener noreferrer" title="立即抓取（跳转 GitHub Actions）" aria-label="立即抓取（跳转 GitHub Actions）">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
        </a>
        <button class="icon-btn" id="theme" title="切换主题" aria-label="切换主题">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="side">
      <div class="side-group">
        <div class="side-title">地区</div>
        <div class="nav-list" id="regions"></div>
      </div>
      <div class="side-group">
        <div class="side-title">App</div>
        <div class="nav-list" id="apps"></div>
      </div>
    </aside>

    <main>
      <div class="main-head">
        <div>
          <h1><span>竞品</span> App 追踪</h1>
          <p id="subtitle">—</p>
        </div>
        <div class="tabs" id="tabs">
          <button class="tab" data-view="overview">总览</button>
          <button class="tab" data-view="profile">竞品画像</button>
          <button class="tab" data-view="features">功能矩阵</button>
          <button class="tab" data-view="reviews">用户评价</button>
          <button class="tab" data-view="media">媒体报道</button>
          <button class="tab" data-view="chart">排名</button>
          <button class="tab" data-view="timeline">更新</button>
          <button class="tab" data-view="compare">对比表</button>
        </div>
      </div>
      <div id="content"><div class="loading">正在加载…</div></div>
    </main>

    <aside class="side right">
      <div class="card widget">
        <div class="widget-head"><b>🚀 最近发版</b><small id="w-region"></small></div>
        <div id="w-recent"></div>
      </div>
      <div class="card widget">
        <div class="widget-head"><b>🏆 财经免费榜</b><small>追踪的 App</small></div>
        <div id="w-ranks"></div>
      </div>
      <div class="card widget">
        <div class="widget-head"><b>📡 来源状态</b><small id="w-ok"></small></div>
        <div id="w-status"></div>
      </div>
    </aside>
  </div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem('aw.' + k)) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem('aw.' + k, JSON.stringify(v)); } catch {} },
};

const DAY = 86400000;
const NEW_DAYS = 7;
const VIEWS = ['overview', 'profile', 'features', 'reviews', 'media', 'chart', 'timeline', 'compare'];
const RV_FILTERS = [['neg', '差评 1–2★', r => r.rating <= 2], ['mid', '中评 3★', r => r.rating === 3], ['pos', '好评 4–5★', r => r.rating >= 4], ['all', '全部', () => true]];
const RV_PAGE = 30;
const COLS = [
  // key, 标题, 取值, 默认降序
  ['name',    'App',      a => a.name, false],
  ['version', '当前版本', a => a.version, false],
  ['days',    '距上次更新', a => age(a.version_date), false],
  ['rating',  '评分',     a => a.rating, true],
  ['count',   '评分人数', a => a.rating_count, true],
  ['rank',    '财经榜',   a => a.rank ?? 999, false],
  ['size',    '包体',     a => a.size, true],
  ['minos',   '最低系统', a => parseFloat(a.min_os) || 0, true],
  ['records', '已记录版本', a => a.history.length, true],
];

const state = {
  data: null,
  view: VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : store.get('view', 'overview'),
  region: store.get('region', 'hk'),
  app: 'all',
  q: '',
  sort: store.get('sort', ['days', false]),
  reviews: null,          // reviews.json 体积较大，进入相关视图时才加载
  revLoading: false,
  rvFilter: 'neg',
  rvPage: 1,
  mediaReviewOnly: false,
};

// ── 主题 ──
const applyTheme = t => document.documentElement.dataset.theme = t;
applyTheme(store.get('theme', 'dark'));
$('#theme').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(t); store.set('theme', t);
};

// ── 工具 ──
const age = iso => iso ? (Date.now() - new Date(iso)) / DAY : Infinity;
const isNew = iso => age(iso) <= NEW_DAYS;
const newTag = iso => isNew(iso) ? ' <span class="new">新</span>' : '';
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, '-') : '—';
const fmtInt = n => (n || 0).toLocaleString('en-US');
const fmtSize = b => b ? (b >= 1e9 ? (b / 1e9).toFixed(2) + ' GB' : Math.round(b / 1e6) + ' MB') : '—';
const fmtRank = r => r ? '#' + r : '100 名外';
const icon = (a, cls = '') => a.icon ? `<img class="app-icon ${cls}" src="${esc(a.icon)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<span class="app-icon ${cls}"></span>`;

function daysAgo(iso) {
  const d = age(iso);
  if (!isFinite(d)) return '—';
  if (d < 1) return '今天';
  if (d < 2) return '昨天';
  return `${Math.floor(d)} 天前`;
}

function matchQ(...texts) {
  if (!state.q) return true;
  const q = state.q.toLowerCase();
  return texts.some(t => (t || '').toLowerCase().includes(q));
}

const regionApps = () => state.data.apps.filter(a => a.region === state.region);
const regionName = () => (state.data.regions.find(r => r.id === state.region) || {}).name || '';

// 迷你走势线：rank 越小越好，所以排名线翻转绘制
function spark(values, invert, color) {
  const pts = values.map((v, i) => [i, v]).filter(p => p[1] != null);
  if (pts.length < 2) return '<div class="pending">数据累积中</div>';
  const ys = pts.map(p => p[1]);
  const min = Math.min(...ys), max = Math.max(...ys), span = max - min || 1;
  const n = values.length - 1 || 1;
  const xy = pts.map(([i, v]) => {
    const t = (v - min) / span;
    return `${(i / n * 100).toFixed(2)},${(4 + (invert ? t : 1 - t) * 22).toFixed(2)}`;
  }).join(' ');
  return `<svg viewBox="0 0 100 30" preserveAspectRatio="none"><polyline points="${xy}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

// ── 左侧导航 ──
function renderNav() {
  $('#regions').innerHTML = state.data.regions.map(r => `
    <button class="nav-item ${state.region === r.id ? 'active' : ''}" data-region="${r.id}">
      <span class="flag">${r.id.toUpperCase()}</span>${r.name}
      <span class="count">${state.data.apps.filter(a => a.region === r.id).length}</span>
    </button>`).join('');
  const apps = regionApps();
  $('#apps').innerHTML = `<button class="nav-item ${state.app === 'all' ? 'active' : ''}" data-app="all"><span class="flag">✦</span>全部<span class="count">${apps.length}</span></button>` +
    apps.map(a => `<button class="nav-item ${state.app === a.key ? 'active' : ''}" data-app="${esc(a.key)}">
      ${icon(a)}${esc(a.name)}<span class="count">${esc(a.version)}</span></button>`).join('');
}

const filteredApps = () => regionApps().filter(a => (state.app === 'all' || a.key === state.app) && matchQ(a.name, a.title, a.seller, a.version, a.notes));

// ── 视图：总览 ──
function renderOverview() {
  const apps = filteredApps().sort((a, b) => age(a.version_date) - age(b.version_date));
  if (!apps.length) return '<div class="empty">没有符合条件的 App</div>';
  return `<div class="app-grid">${apps.map(a => `
    <section class="card app ${isNew(a.version_date) ? 'fresh' : ''}">
      <div class="app-head">${icon(a, 'lg')}
        <div><b><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.name)}</a>${newTag(a.version_date)}</b>
          <small title="${esc(a.title)}">${esc(a.seller)}</small>
          ${a.stale ? '<small class="warn">本次抓取失败，显示旧数据</small>' : ''}</div>
      </div>
      <div class="stats">
        <div class="stat"><span>当前版本</span><b title="${esc(a.version)}">${esc(a.version)}</b><small>${esc(daysAgo(a.version_date))}</small></div>
        <div class="stat"><span>评分</span><b><span class="star">★</span> ${a.rating.toFixed(2)}</b><small>${fmtInt(a.rating_count)} 人</small></div>
        <div class="stat"><span>财经榜</span><b>${fmtRank(a.rank)}</b><small>${esc(regionName())}免费榜</small></div>
      </div>
      ${a.notes ? `<p class="notes">${esc(a.notes)}</p>` : ''}
      <div class="sparks">
        <div class="spark">排名走势${spark(a.daily.map(d => d.rank), true, 'var(--accent)')}</div>
        <div class="spark">评分人数走势${spark(a.daily.map(d => d.count), false, 'var(--star)')}</div>
      </div>
      <div class="meta-row">
        ${a.review_stats && a.review_stats.total ? `<span>近期口碑 <b><span class="star">★</span> ${a.review_stats.avg.toFixed(2)}</b></span>` : ''}
        ${topTopics(a, 1).length ? `<span>最多吐槽 <b class="down">${esc(topTopics(a, 1)[0].name)}</b></span>` : ''}
        <span>功能 <b>${Object.keys(a.features || {}).length}</b> 项</span>
        <span>报道 <b>${(a.news || []).length}</b> 篇</span>
        <button class="chip-btn" data-profile="${esc(a.key)}" style="margin-left:auto">查看画像 →</button>
      </div>
    </section>`).join('')}</div>`;
}

// ── 公共：评论 / 功能 / 报道 ──
const stars = n => `<span class="stars ${n <= 2 ? 'low' : ''}">${'★'.repeat(n)}${'☆'.repeat(5 - n)}</span>`;
const pct = (n, d) => d ? Math.round(n / d * 100) : 0;
const topicName = id => (state.data.topics.find(t => t.id === id) || {}).name || id;

function topTopics(a, n = 3) {
  const s = a.review_stats || {};
  return Object.entries(s.topics || {}).filter(([, v]) => v > 0).sort((x, y) => y[1] - x[1]).slice(0, n)
    .map(([id, v]) => ({ id, name: topicName(id), count: v, pct: pct(v, s.neg) }));
}

async function ensureReviews() {
  if (state.reviews || state.revLoading) return;
  state.revLoading = true;
  try {
    const res = await fetch('reviews.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    state.reviews = (await res.json()).apps || {};
  } catch (e) {
    state.reviews = {};
    state.reviewsError = e.message;
  } finally {
    state.revLoading = false;
    if (['profile', 'reviews'].includes(state.view)) render();
  }
}
const appReviews = key => (state.reviews || {})[key] || [];

function distBars(s) {
  const total = Object.values(s.dist || {}).reduce((x, y) => x + y, 0);
  return `<div class="bars">${[5, 4, 3, 2, 1].map(k => {
    const v = (s.dist || {})[k] || 0;
    return `<div class="bar-row"><span>${'★'.repeat(k)}</span><div class="bar star"><i style="width:${pct(v, total)}%"></i></div><span>${pct(v, total)}%</span></div>`;
  }).join('')}</div>`;
}

function reviewItem(r, a) {
  return `<div class="rv">
    <div class="rv-meta">${a ? icon(a) + `<b style="display:inline;font-size:12px;margin:0">${esc(a.name)}</b>` : ''}${stars(r.rating)}
      <span>v${esc(r.version)}</span><span>${esc(fmtDate(r.date))}</span>${r.votes ? `<span>👍 ${r.votes}</span>` : ''}</div>
    ${r.title ? `<b>${esc(r.title)}</b>` : ''}<p>${esc(r.content)}</p>
  </div>`;
}

function newsItem(n, a) {
  return `<div class="nw">${a ? icon(a) : ''}${n.review ? '<span class="rev-tag">评测</span>' : ''}
    <a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>
    <small>${esc(n.source)} · ${esc(fmtDate(n.date))}</small></div>`;
}

// ── 视图：竞品画像 ──
function renderProfile() {
  const apps = regionApps();
  const a = apps.find(x => x.key === state.app);
  if (!a) {
    return `<div class="section-title"><b>选择一个 App 查看画像</b>也可以点左侧列表</div>
      <div class="pick">${apps.map(x => `<button class="card" data-app="${esc(x.key)}">${icon(x, 'md')}<div><b>${esc(x.name)}</b><br><small class="muted">${esc(x.seller)}</small></div></button>`).join('')}</div>`;
  }
  ensureReviews();
  const s = a.review_stats || {};
  const groups = [...new Set(state.data.features.map(f => f.group))];
  const feats = groups.map(g => {
    const tags = state.data.features.filter(f => f.group === g && a.features[f.id]);
    return tags.length ? `<div class="grp"><span>${g}</span><div>${tags.map(f => {
      const v = a.features[f.id];
      return `<span class="ftag ${v.src === 'notes' ? 'notes' : ''}" title="${v.src === 'notes' ? `更新说明 ${esc(v.version)}（${esc(v.since)}）提及` : '商店描述中提及'}">${esc(f.name)}</span>`;
    }).join('')}</div></div>` : '';
  }).join('');
  const revs = appReviews(a.key);
  const neg = revs.filter(r => r.rating <= 2).slice(0, 5);
  const pos = revs.filter(r => r.rating >= 4 && r.content.length > 15).slice(0, 3);
  const kw = state.data.keywords[state.region] || {};
  const intro = a.intro || (a.highlights || [])[0] || a.title;

  return `<section class="card pf-head">${icon(a)}
      <div><h2><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.name)}</a></h2><p>${esc(a.title)}<br>${esc(a.seller)}</p></div>
      <div class="pf-kpis">
        <div><b><span class="star">★</span> ${a.rating.toFixed(2)}</b><span>${fmtInt(a.rating_count)} 人评分</span></div>
        <div><b>${s.total ? s.avg.toFixed(2) : '—'}</b><span>${s.window === 'recent' ? '近 90 天' : '已收集'}评论均分</span></div>
        <div><b>${fmtRank(a.rank)}</b><span>${esc(regionName())}财经榜</span></div>
        <div><b>${esc(a.version)}</b><span>${esc(daysAgo(a.version_date))}发版</span></div>
      </div>
    </section>
    <div class="pf-grid">
      <section class="card pf-sec wide"><h3>🎯 定位</h3>
        <p class="pf-intro">${esc(intro)}</p>
        <div class="meta-row"><span>上架 <b>${esc(a.released || '—')}</b></span><span>包体 <b>${fmtSize(a.size)}</b></span>
          <span>最低系统 <b>iOS ${esc(a.min_os)}</b></span><span>支持语言 <b>${a.languages || '—'}</b> 种</span></div>
      </section>
      <section class="card pf-sec"><h3>🧩 主要功能<small>${Object.keys(a.features).length} 项 · 依据商店描述与更新说明</small></h3>
        <div class="ftags">${feats || '<span class="muted">未识别到功能关键词</span>'}</div>
        <p class="note">绿色描边的是在更新说明里提到过的（悬停看版本）。</p>
      </section>
      <section class="card pf-sec"><h3>✨ 突出卖点<small>商店描述原文</small></h3>
        ${(a.highlights || []).length ? `<ol class="hl-list">${a.highlights.map(h => `<li>${esc(h)}</li>`).join('')}</ol>` : '<p class="muted">商店描述里没有列表形式的卖点</p>'}
      </section>
      ${(a.screenshots || []).length ? `<section class="card pf-sec wide"><h3>🖼️ 商店截图<small>截图上的宣传语就是主推卖点</small></h3>
        <div class="shots">${a.screenshots.map(u => `<img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer">`).join('')}</div></section>` : ''}
      <section class="card pf-sec"><h3>💬 用户评价<small>${s.total ? `已收集 ${s.total} 条 · ${esc(s.oldest)} 起` : ''}</small></h3>
        ${s.total ? `${distBars(s)}
          <div class="section-title" style="margin-top:16px"><b>差评主题</b>${s.neg} 条 1–2★</div>
          <div class="bars">${topTopics(a, 6).map(t => `<div class="bar-row"><span>${esc(t.name)}</span><div class="bar neg"><i style="width:${t.pct}%"></i></div><span>${t.pct}%</span></div>`).join('') || '<span class="muted">差评太少，暂无主题</span>'}</div>`
          : '<p class="muted">暂无评论数据（苹果未返回，或今天抓取时被限流，之后每天会补抓）</p>'}
      </section>
      <section class="card pf-sec"><h3>📊 版本口碑<small>每个版本的评论均分</small></h3>
        ${(s.versions || []).length ? `<div class="table-wrap"><table><thead><tr><th>版本</th><th class="num">评论</th><th class="num">均分</th><th class="num">差评</th><th class="num">最近</th></tr></thead>
          <tbody>${s.versions.map(v => `<tr><td>${esc(v.version)}</td><td class="num">${v.count}</td>
            <td class="num ${v.avg < 3 ? 'down' : v.avg >= 4.5 ? 'up' : ''}">${v.avg.toFixed(2)}</td><td class="num">${v.neg}</td><td class="num muted">${esc(v.last)}</td></tr>`).join('')}</tbody></table></div>`
          : '<p class="muted">样本不足（每个版本至少 3 条评论才统计）</p>'}
      </section>
      <section class="card pf-sec"><h3>👎 最新差评</h3>
        ${!state.reviews ? '<p class="muted">评论加载中…</p>' : neg.map(r => reviewItem(r)).join('') || '<p class="muted">暂无差评</p>'}
      </section>
      <section class="card pf-sec"><h3>👍 最新好评</h3>
        ${!state.reviews ? '<p class="muted">评论加载中…</p>' : pos.map(r => reviewItem(r)).join('') || '<p class="muted">暂无好评</p>'}
      </section>
      <section class="card pf-sec"><h3>📰 媒体评价<small>近 30 天 · 已排除自家渠道</small></h3>
        ${(a.news || []).slice(0, 8).map(n => newsItem(n)).join('') || '<p class="muted">近 30 天没有第三方媒体报道</p>'}
      </section>
      <section class="card pf-sec"><h3>🔍 搜索可见度<small>App Store 关键词排名</small></h3>
        <div class="bars">${Object.entries(kw).map(([k, ranks]) => {
          const r = ranks[String(a.id)];
          return `<div class="bar-row"><span>${esc(k)}</span><div class="bar"><i style="width:${r ? Math.max(4, 100 - (r - 1) * 2) : 0}%"></i></div><span>${r ? '#' + r : '—'}</span></div>`;
        }).join('')}</div>
        <p class="note">「—」表示不在搜索结果前 100 名。</p>
      </section>
      <section class="card pf-sec wide"><h3>🚀 最近版本<small>${a.history.length} 条记录</small></h3>
        ${a.history.slice(0, 3).map(h => `<div class="rv"><div class="rv-meta"><b style="display:inline;font-size:13px;margin:0;color:var(--accent)">${esc(h.version)}</b><span>${esc(fmtDate(h.date))}</span></div><p style="white-space:pre-line">${esc(h.notes || '（没有填写更新说明）')}</p></div>`).join('')}
      </section>
    </div>`;
}

// ── 视图：功能矩阵 ──
function renderFeatures() {
  const apps = regionApps().filter(a => state.app === 'all' || a.key === state.app);
  const feats = state.data.features.filter(f => matchQ(f.name, f.group));
  const groups = [...new Set(feats.map(f => f.group))];
  return `<div class="card table-wrap"><table class="matrix">
    <thead><tr><th>功能</th>${apps.map(a => `<th>${icon(a)}${esc(a.name)}</th>`).join('')}</tr></thead>
    <tbody>${groups.map(g => `<tr class="grp"><td colspan="${apps.length + 1}">${g}</td></tr>` +
      feats.filter(f => f.group === g).map(f => `<tr><td>${esc(f.name)}</td>${apps.map(a => {
        const v = (a.features || {})[f.id];
        return `<td>${v ? `<span class="yes ${v.src === 'notes' ? 'notes' : ''}" title="${v.src === 'notes' ? `更新说明 ${esc(v.version)}（${esc(v.since)}）提及` : '商店描述中提及'}">✓</span>` : '<span class="no">–</span>'}</td>`;
      }).join('')}</tr>`).join('')).join('')}
      <tr class="grp"><td>合计</td>${apps.map(a => `<td>${Object.keys(a.features || {}).length}</td>`).join('')}</tr>
    </tbody></table></div>
    <p class="note">依据各家在 App Store 描述和更新说明里宣称的内容自动识别（关键词匹配），「–」只代表没有提到，不等于不支持。绿色 ✓ 表示在更新说明里提到过。</p>`;
}

// ── 视图：用户评价 ──
function renderReviews() {
  ensureReviews();
  const apps = regionApps().filter(a => state.app === 'all' || a.key === state.app);
  const cards = apps.map(a => {
    const s = a.review_stats || {};
    if (!s.total) return `<div class="card rv-card"><div class="top">${icon(a)}<b>${esc(a.name)}</b></div><small style="margin-top:8px">暂无评论数据</small></div>`;
    const tot = Object.values(s.dist).reduce((x, y) => x + y, 0);
    const colors = { 5: 'var(--up)', 4: '#84cc16', 3: 'var(--star)', 2: '#f97316', 1: 'var(--down)' };
    return `<div class="card rv-card">
      <div class="top">${icon(a)}<b>${esc(a.name)}</b><span class="big"><span class="star">★</span> ${s.avg.toFixed(2)}</span></div>
      <div class="mini-stack">${[5, 4, 3, 2, 1].map(k => `<i style="width:${pct(s.dist[k], tot)}%;background:${colors[k]}" title="${k}★ ${s.dist[k]} 条"></i>`).join('')}</div>
      <small>${s.window === 'recent' ? '近 90 天' : '全部已收集'} ${s.sample} 条 · 差评 ${pct(s.neg, s.sample)}%</small>
      <div class="chips2">${topTopics(a).map(t => `<span>${esc(t.name)} ${t.pct}%</span>`).join('')}</div>
    </div>`;
  }).join('');

  const withNeg = apps.filter(a => (a.review_stats || {}).neg);
  const heat = withNeg.length ? `<div class="section-title"><b>差评主题对比</b>各 App 1–2★ 评论中提到该主题的比例</div>
    <div class="card table-wrap"><table class="matrix">
      <thead><tr><th>主题</th>${withNeg.map(a => `<th>${icon(a)}${esc(a.name)}</th>`).join('')}</tr></thead>
      <tbody>${state.data.topics.map(t => `<tr><td>${esc(t.name)}</td>${withNeg.map(a => {
        const s = a.review_stats, p = pct(s.topics[t.id] || 0, s.neg);
        return `<td><span class="heat" style="background:color-mix(in srgb, var(--down) ${Math.min(p * 1.4, 70)}%, transparent)">${p ? p + '%' : '–'}</span></td>`;
      }).join('')}</tr>`).join('')}
      <tr class="grp"><td>差评样本</td>${withNeg.map(a => `<td>${a.review_stats.neg}</td>`).join('')}</tr></tbody></table></div>` : '';

  const f = RV_FILTERS.find(x => x[0] === state.rvFilter) || RV_FILTERS[0];
  const appByKey = Object.fromEntries(apps.map(a => [a.key, a]));
  const feed = state.reviews ? apps.flatMap(a => appReviews(a.key).map(r => ({ r, a })))
    .filter(({ r, a }) => f[2](r) && matchQ(r.title, r.content, a.name, r.version))
    .sort((x, y) => y.r.date.localeCompare(x.r.date)) : [];
  const shown = feed.slice(0, state.rvPage * RV_PAGE);
  return `<div class="rv-cards">${cards}</div>${heat}
    <div class="section-title"><b>评论流</b>${state.reviews ? `${feed.length} 条` : '加载中…'}</div>
    <div class="toolbar">${RV_FILTERS.map(x => `<button class="chip-btn ${x[0] === state.rvFilter ? 'on' : ''}" data-rv="${x[0]}">${x[1]}</button>`).join('')}
      <span class="muted">支持搜索评论内容</span></div>
    <div class="card pf-sec">${shown.map(({ r, a }) => reviewItem(r, appByKey[a.key])).join('') || `<p class="muted">${state.reviews ? '没有符合条件的评论' : '评论加载中…'}</p>`}</div>
    ${feed.length > shown.length ? `<button class="load-more chip-btn" data-rvmore="1" style="display:block;margin:14px auto 0">加载更多（剩余 ${feed.length - shown.length} 条）</button>` : ''}
    <p class="note">评论来自 App Store 公开评论接口（每个 App 每个地区最多最近 500 条，每天累积）。差评主题按关键词归类，一条评论可能属于多个主题。</p>`;
}

// ── 视图：媒体报道 ──
function renderMedia() {
  const apps = regionApps().filter(a => state.app === 'all' || a.key === state.app);
  const rows = apps.flatMap(a => (a.news || []).map(n => ({ n, a })))
    .filter(({ n, a }) => (!state.mediaReviewOnly || n.review) && matchQ(n.title, n.source, a.name))
    .sort((x, y) => y.n.date.localeCompare(x.n.date));
  const per = apps.map(a => `<span class="chip-btn" style="cursor:default">${esc(a.name)} ${(a.news || []).length}</span>`).join('');
  return `<div class="toolbar">
      <button class="chip-btn ${!state.mediaReviewOnly ? 'on' : ''}" data-media="all">全部报道</button>
      <button class="chip-btn ${state.mediaReviewOnly ? 'on' : ''}" data-media="review">只看评测 / 对比</button>
      <span class="muted">${rows.length} 篇</span></div>
    <div class="toolbar">${per}</div>
    <div class="card pf-sec">${rows.map(({ n, a }) => newsItem(n, a)).join('') || '<p class="muted">没有符合条件的报道</p>'}</div>
    <p class="note">来自 Google News 近 30 天的搜索结果，已排除各家自己的资讯频道和官网发布。标题含 review / 評測 / 比較 / vs 的标为「评测」。</p>`;
}

// ── 关键词排名表（放在排名视图里） ──
function keywordTable() {
  const kw = state.data.keywords[state.region] || {};
  const apps = regionApps();
  if (!Object.keys(kw).length) return '';
  const cls = r => !r ? 'no' : r <= 3 ? 'rk-cell g1' : r <= 10 ? 'rk-cell g2' : 'rk-cell g3';
  return `<div class="section-title"><b>关键词搜索排名</b>在 App Store 搜这个词时排第几（前 100 名）</div>
    <div class="card table-wrap"><table class="matrix">
      <thead><tr><th>关键词</th>${apps.map(a => `<th>${icon(a)}${esc(a.name)}</th>`).join('')}</tr></thead>
      <tbody>${Object.entries(kw).map(([k, ranks]) => `<tr><td>${esc(k)}</td>${apps.map(a => {
        const r = ranks[String(a.id)];
        return `<td><span class="${cls(r)}">${r ? '#' + r : '–'}</span></td>`;
      }).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="section-title"><b>财经类免费榜</b>前 100</div>`;
}

// ── 视图：更新时间线 ──
function renderTimeline() {
  // 时间线按每条版本记录搜索，不用 filteredApps（它只看当前版本的说明）
  const rows = [];
  regionApps().filter(a => state.app === 'all' || a.key === state.app).forEach(a => a.history.forEach(h => {
    if (matchQ(a.name, h.version, h.notes)) rows.push({ a, h });
  }));
  rows.sort((x, y) => (y.h.date || '').localeCompare(x.h.date || ''));
  if (!rows.length) return '<div class="empty">没有符合条件的更新</div>';
  const since = state.data.apps.reduce((m, a) => a.tracked_since < m ? a.tracked_since : m, '9999');
  return `<div class="tl">${rows.map(({ a, h }) => `
    <article class="card rel">
      ${icon(a, 'md')}
      <div class="rel-body">
        <div class="rel-meta"><b>${esc(a.name)}</b><span class="ver">${esc(h.version)}</span>${newTag(h.date)}
          <span>${esc(fmtDate(h.date))} · ${esc(daysAgo(h.date))}</span></div>
        ${h.notes ? `<details><summary><p class="notes">${esc(h.notes)}</p><div class="more">展开全部</div></summary></details>` : '<p class="notes muted">（没有填写更新说明）</p>'}
      </div>
    </article>`).join('')}</div>
    <p class="note">App Store 只提供当前版本，历史版本从 ${esc(since)} 开始追踪后逐步累积。</p>`;
}

// ── 视图：对比表 ──
function renderCompare() {
  const apps = filteredApps();
  if (!apps.length) return '<div class="empty">没有符合条件的 App</div>';
  const [key, desc] = state.sort;
  const col = COLS.find(c => c[0] === key) || COLS[2];
  apps.sort((a, b) => {
    const x = col[2](a), y = col[2](b);
    const r = typeof x === 'string' ? x.localeCompare(y, 'zh') : x - y;
    return desc ? -r : r;
  });
  return `<div class="card table-wrap"><table>
    <thead><tr>${COLS.map(c => `<th data-sort="${c[0]}" class="${c[0] === key ? 'sorted' : ''} ${c[0] === 'name' || c[0] === 'version' ? '' : 'num'}">${c[1]}${c[0] === key ? (desc ? ' ↓' : ' ↑') : ''}</th>`).join('')}</tr></thead>
    <tbody>${apps.map(a => `<tr>
      <td class="app-cell">${icon(a)}<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.name)}</a></td>
      <td>${esc(a.version)}</td>
      <td class="num">${esc(daysAgo(a.version_date))}${newTag(a.version_date)}</td>
      <td class="num"><span class="star">★</span> ${a.rating.toFixed(2)}</td>
      <td class="num">${fmtInt(a.rating_count)}</td>
      <td class="num">${fmtRank(a.rank)}</td>
      <td class="num">${fmtSize(a.size)}</td>
      <td class="num">iOS ${esc(a.min_os)}</td>
      <td class="num">${a.history.length}</td>
    </tr>`).join('')}</tbody></table></div>
    <p class="note">点表头排序。「已记录版本」从开始追踪起累计；评分为该地区商店全部版本的平均分。</p>`;
}

// ── 视图：财经榜 ──
function renderChart() {
  const c = state.data.charts[state.region];
  if (!c || !c.entries.length) return '<div class="empty">暂无榜单数据</div>';
  const tracked = new Set(regionApps().map(a => a.id));
  const rows = c.entries.filter(e => matchQ(e.name, e.seller));
  const delta = e => {
    if (!c.prev_day) return '';
    if (e.prev_rank == null) return '<span class="up">新进</span>';
    const d = e.prev_rank - e.rank;
    return d > 0 ? `<span class="up">↑${d}</span>` : d < 0 ? `<span class="down">↓${-d}</span>` : '<span class="muted">–</span>';
  };
  return `${keywordTable()}<div class="card rank-list">${rows.map(e => `
    <div class="rank-row ${tracked.has(e.id) ? 'tracked' : ''}">
      <span class="rk ${e.rank <= 3 ? 'top' : ''}">${e.rank}</span>
      ${icon(e, 'md')}
      <div class="nm"><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.name)}</a><small>${esc(e.seller)}</small></div>
      <span class="dl">${delta(e)}</span>
    </div>`).join('') || '<div class="empty">没有符合条件的 App</div>'}</div>
    <p class="note">${esc(regionName())} App Store 财经类免费榜前 100。高亮的是追踪中的 App。${c.prev_day ? `升降对比 ${esc(c.prev_day)}。` : '升降对比从明天开始显示。'}</p>`;
}

// ── 右侧挂件 ──
function renderWidgets() {
  const apps = regionApps();
  $('#w-region').textContent = regionName();
  $('#w-recent').innerHTML = [...apps].sort((a, b) => age(a.version_date) - age(b.version_date)).slice(0, 6).map(a => `
    <div class="w-row">${icon(a)}<span class="nm">${esc(a.name)} <span class="muted">${esc(a.version)}</span></span><small>${esc(daysAgo(a.version_date))}</small></div>`).join('');
  $('#w-ranks').innerHTML = [...apps].sort((a, b) => (a.rank ?? 999) - (b.rank ?? 999)).map(a => `
    <div class="w-row">${icon(a)}<span class="nm">${esc(a.name)}</span><small>${fmtRank(a.rank)}</small></div>`).join('');
  const { sources } = state.data;
  $('#w-ok').textContent = `${sources.filter(s => s.ok).length}/${sources.length} 正常`;
  $('#w-status').innerHTML = sources.map(s => `
    <div class="status-row" title="${esc(s.error)}">${esc(s.name)}
      <span class="t">${s.ok ? `<span class="ok">●</span> ${s.count} 条` : `<span class="bad">●</span> 异常`}</span></div>`).join('');
}

// ── 渲染入口 ──
function render() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === state.view));
  renderNav();
  renderWidgets();
  $('#content').innerHTML = { overview: renderOverview, profile: renderProfile, features: renderFeatures, reviews: renderReviews,
    media: renderMedia, timeline: renderTimeline, compare: renderCompare, chart: renderChart }[state.view]();
  const apps = regionApps();
  const week = apps.filter(a => isNew(a.version_date)).length;
  $('#subtitle').textContent = `${regionName()} · 追踪 ${apps.length} 个 App · ${week} 个在 7 天内发版`;
  $('#updated').textContent = `更新于 ${new Date(state.data.updated).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })}`;
}

async function load(isRefresh) {
  const btn = $('#reload');
  if (btn.disabled) return;
  btn.disabled = true;
  btn.classList.add('spin');
  try {
    const res = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    state.data = await res.json();
    if (!state.data.regions.some(r => r.id === state.region)) state.region = state.data.regions[0].id;
    if (state.app !== 'all' && !state.data.apps.some(a => a.key === state.app)) state.app = 'all';
    render();
    btn.title = '重新加载数据';
  } catch (e) {
    // 刷新失败保留已有内容，只有首次加载失败才替换为报错
    if (!isRefresh || !state.data) {
      $('#content').innerHTML = `<div class="empty">数据加载失败：${esc(e.message)}<br><small>本地预览需通过 HTTP 服务打开（python3 -m http.server）</small></div>`;
    }
    btn.title = '刷新失败，请稍后重试';
  } finally {
    btn.disabled = false;
    btn.classList.remove('spin');
  }
}

// ── 事件绑定 ──
document.addEventListener('click', e => {
  const t = e.target.closest('[data-region],[data-app],[data-view],[data-sort],[data-profile],[data-rv],[data-rvmore],[data-media]');
  if (!t || !state.data) return;
  if (t.dataset.region) { state.region = t.dataset.region; state.app = 'all'; store.set('region', state.region); }
  else if (t.dataset.app) { state.app = t.dataset.app; state.rvPage = 1; if (state.view === 'overview' && t.dataset.app !== 'all') state.view = 'profile'; }
  else if (t.dataset.profile) { state.app = t.dataset.profile; state.view = 'profile'; history.replaceState(null, '', '#profile'); window.scrollTo(0, 0); }
  else if (t.dataset.rv) { state.rvFilter = t.dataset.rv; state.rvPage = 1; }
  else if (t.dataset.rvmore) { state.rvPage++; }
  else if (t.dataset.media) { state.mediaReviewOnly = t.dataset.media === 'review'; }
  else if (t.dataset.view) { state.view = t.dataset.view; store.set('view', state.view); history.replaceState(null, '', '#' + state.view); }
  else if (t.dataset.sort) {
    const col = COLS.find(c => c[0] === t.dataset.sort);
    state.sort = state.sort[0] === col[0] ? [col[0], !state.sort[1]] : [col[0], col[3]];
    store.set('sort', state.sort);
  }
  render();
});

let timer;
$('#q').addEventListener('input', e => {
  clearTimeout(timer);
  timer = setTimeout(() => { state.q = e.target.value.trim(); if (state.data) render(); }, 150);
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape' && document.activeElement === $('#q')) { $('#q').value = ''; state.q = ''; if (state.data) render(); $('#q').blur(); }
});
if (!/Mac/.test(navigator.platform)) $('#kbd').textContent = 'Ctrl K';
$('#reload').onclick = () => load(true);

load(false);
setInterval(() => load(true), 10 * 60 * 1000);  // 每 10 分钟自动重新读取
</script>
</body>
</html>
